<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>گزارش دانش‌آموز | کلاس‌یار</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 35px auto 60px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .title p {
            color: #94a3b8;
        }

        .back-btn {
            border: none;
            background: #1e293b;
            color: white;
            padding: 13px 22px;
            border-radius: 12px;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #334155;
        }

        .profile-card {
            background: #1e293b;
            border-radius: 22px;
            padding: 30px;
            margin-bottom: 22px;
        }

        .student-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            flex-shrink: 0;
        }

        .student-name {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .student-details {
            color: #94a3b8;
            line-height: 2;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: #1e293b;
            border-radius: 18px;
            padding: 22px;
            text-align: center;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a78bfa;
        }

        .stat-title {
            color: #94a3b8;
            font-size: 13px;
        }

        .grades-card {
            background: #1e293b;
            border-radius: 22px;
            padding: 25px;
        }

        .grades-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .grades-header h2 {
            font-size: 21px;
        }

        .edit-btn {
            border: none;
            background: #6946e8;
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .grade-list {
            display: grid;
            gap: 10px;
        }

        .grade-row {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grade-position {
            color: #cbd5e1;
        }

        .grade-value {
            font-weight: bold;
            font-size: 18px;
        }

        .good {
            color: #22c55e;
        }

        .medium {
            color: #f59e0b;
        }

        .bad {
            color: #ef4444;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }

        .error {
            background: #7f1d1d;
            color: #fecaca;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .secondary-btn {
            flex: 1;
            border: none;
            background: #334155;
            color: white;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .secondary-btn:hover {
            background: #475569;
        }

        @media (max-width: 700px) {

            .top {
                flex-direction: column;
                align-items: stretch;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .student-header {
                flex-direction: column;
                text-align: center;
            }

            .grades-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .edit-btn {
                width: 100%;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <div class="top">

        <div class="title">

            <h1>
                📊 گزارش دانش‌آموز
            </h1>

            <p>
                مشاهده وضعیت و نمرات دانش‌آموز
            </p>

        </div>

        <button
            type="button"
            class="back-btn"
            id="backBtn"
        >
            ← بازگشت به دانش‌آموزان
        </button>

    </div>


    <div id="content">

        <div class="loading">
            در حال دریافت اطلاعات...
        </div>

    </div>

</main>


<script>

const API_URL =
    "http://localhost:3000";

const token =
    localStorage.getItem(
        "kelasyarToken"
    );

const classId =
    localStorage.getItem(
        "selectedClassId"
    );

const studentId =
    localStorage.getItem(
        "selectedStudentId"
    );


/* =========================
   بررسی
========================= */

if (!token) {

    window.location.href =
        "login.html";

}


if (!classId || !studentId) {

    alert(
        "کلاس یا دانش‌آموز انتخاب نشده است."
    );

    window.location.href =
        "students.html";

}


/* =========================
   API
========================= */

async function apiFetch(url) {

    const response =
        await fetch(
            API_URL + url,
            {
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );


    if (response.status === 401) {

        localStorage.removeItem(
            "kelasyarToken"
        );

        localStorage.removeItem(
            "kelasyarUser"
        );

        window.location.href =
            "login.html";

        return null;
    }


    return response;
}


/* =========================
   دریافت اطلاعات
========================= */

async function loadReport() {

    const content =
        document.getElementById(
            "content"
        );


    try {

        const response =
            await apiFetch(
                `/api/classes/${classId}/students`
            );


        if (!response) {
            return;
        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "خطا در دریافت اطلاعات دانش‌آموز"
            );

        }


        const students =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(data.students)
                        ? data.students
                        : []
                );


        const student =
            students.find(
                item =>
                    String(item.id) ===
                    String(studentId)
            );


        if (!student) {

            throw new Error(
                "دانش‌آموز موردنظر پیدا نشد."
            );

        }


        /*
           دریافت نام کلاس
        */

        const classResponse =
            await apiFetch(
                "/api/classes"
            );


        let className =
            "کلاس";

        let classGrade =
            "";


        if (classResponse) {

            const classData =
                await classResponse.json();


            const classes =
                Array.isArray(classData)
                    ? classData
                    : (
                        Array.isArray(
                            classData.classes
                        )
                            ? classData.classes
                            : []
                    );


            const selectedClass =
                classes.find(
                    item =>
                        String(item.id) ===
                        String(classId)
                );


            if (selectedClass) {

                className =
                    selectedClass.name ||
                    "کلاس";

                classGrade =
                    selectedClass.grade ||
                    "";

            }

        }


        /*
           نمرات
        */

        const grades =
            Array.isArray(student.grades)
                ? student.grades
                : [];


        const validGrades =
            grades
                .map(
                    item => {

                        if (
                            typeof item ===
                            "object"
                        ) {

                            return {
                                position:
                                    item.position,

                                grade:
                                    Number(
                                        item.grade
                                    )
                            };

                        }


                        return {
                            position: null,
                            grade:
                                Number(item)
                        };

                    }
                )
                .filter(
                    item =>
                        !Number.isNaN(
                            item.grade
                        )
                );


        const gradeSum =
            validGrades.reduce(
                (
                    total,
                    item
                ) =>
                    total +
                    item.grade,
                0
            );


        const average =
            validGrades.length
                ? (
                    gradeSum /
                    validGrades.length
                ).toFixed(2)
                : "0";


        renderReport(
            student,
            className,
            classGrade,
            validGrades,
            average
        );


    } catch (error) {

        console.error(
            "REPORT ERROR:",
            error
        );


        content.innerHTML =
            `
            <div class="error">
                ${escapeHtml(
                    error.message ||
                    "خطایی رخ داد."
                )}
            </div>
            `;

    }

}


/* =========================
   نمایش گزارش
========================= */

function renderReport(
    student,
    className,
    classGrade,
    grades,
    average
) {

    const content =
        document.getElementById(
            "content"
        );


    let averageClass =
        "good";


    if (
        Number(average) < 10
    ) {

        averageClass =
            "bad";

    }
    else if (
        Number(average) < 14
    ) {

        averageClass =
            "medium";

    }


    let gradesHtml =
        "";


    if (!grades.length) {

        gradesHtml =
            `
            <div class="empty">
                هنوز نمره‌ای برای این دانش‌آموز ثبت نشده است.
            </div>
            `;

    } else {

        gradesHtml =
            grades.map(
                (
                    item,
                    index
                ) => {

                    const position =
                        item.position ||
                        (index + 1);


                    let gradeClass =
                        "good";


                    if (
                        item.grade < 10
                    ) {

                        gradeClass =
                            "bad";

                    }
                    else if (
                        item.grade < 14
                    ) {

                        gradeClass =
                            "medium";

                    }


                    return `
                        <div class="grade-row">

                            <div class="grade-position">
                                نمره ${position}
                            </div>

                            <div
                                class="grade-value ${gradeClass}"
                            >
                                ${item.grade}
                            </div>

                        </div>
                    `;

                }
            ).join("");

    }


    content.innerHTML =
        `
        <section class="profile-card">

            <div class="student-header">

                <div class="avatar">
                    👨‍🎓
                </div>

                <div>

                    <div class="student-name">
                        ${escapeHtml(
                            student.name
                        )}
                    </div>

                    <div class="student-details">

                        کد دانش‌آموز:
                        ${escapeHtml(
                            student.code || "-"
                        )}

                        <br>

                        کلاس:
                        ${escapeHtml(
                            className
                        )}

                        ${
                            classGrade
                                ? ` | پایه ${escapeHtml(classGrade)}`
                                : ""
                        }

                    </div>

                </div>

            </div>

        </section>


        <section class="stats">

            <div class="stat-card">

                <div class="stat-number">
                    ${grades.length}
                </div>

                <div class="stat-title">
                    تعداد نمرات
                </div>

            </div>


            <div class="stat-card">

                <div
                    class="stat-number ${averageClass}"
                >
                    ${average}
                </div>

                <div class="stat-title">
                    میانگین
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-number">
                    20
                </div>

                <div class="stat-title">
                    حداکثر نمره
                </div>

            </div>

        </section>


        <section class="grades-card">

            <div class="grades-header">

                <h2>
                    📝 نمرات
                </h2>

                <button
                    type="button"
                    class="edit-btn"
                    id="editGradesBtn"
                >
                    ✏️ ویرایش نمرات
                </button>

            </div>


            <div class="grade-list">

                ${gradesHtml}

            </div>


            <div class="actions">

                <button
                    type="button"
                    class="secondary-btn"
                    id="studentsBtn"
                >
                    👨‍🎓 لیست دانش‌آموزان
                </button>

                <button
                    type="button"
                    class="secondary-btn"
                    id="dashboardBtn"
                >
                    🏠 داشبورد
                </button>

            </div>

        </section>
        `;


    document.getElementById(
        "editGradesBtn"
    ).addEventListener(
        "click",
        function() {

            window.location.href =
                "grades.html";

        }
    );


    document.getElementById(
        "studentsBtn"
    ).addEventListener(
        "click",
        function() {

            window.location.href =
                "students.html";

        }
    );


    document.getElementById(
        "dashboardBtn"
    ).addEventListener(
        "click",
        function() {

            window.location.href =
                "dashboard.html";

        }
    );

}


/* =========================
   بازگشت
========================= */

document.getElementById(
    "backBtn"
).addEventListener(
    "click",
    function() {

        window.location.href =
            "students.html";

    }
);


/* =========================
   جلوگیری از HTML
========================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   شروع
========================= */

loadReport();

</script>

</body>

</html>
