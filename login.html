<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود معلم | کلاس‌یار</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            background: #f8f7ff;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 50px rgba(82, 55, 164, 0.10);
        }

        .auth-logo {
            text-align: center;
            color: #6c4ce3;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 22px;
        }

        .auth-card h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .auth-description {
            text-align: center;
            color: #77738d;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .auth-form label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 14px 0 6px;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e0f3;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        .auth-form input:focus {
            border-color: #6c4ce3;
            box-shadow: 0 0 0 3px rgba(108, 76, 227, 0.10);
        }

        .auth-submit {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 10px;
            background: #6c4ce3;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-submit:hover {
            background: #5133c4;
        }

        .auth-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .auth-footer {
            text-align: center;
            font-size: 13px;
            margin-top: 22px;
            color: #77738d;
        }

        .auth-footer a {
            color: #6c4ce3;
            font-weight: 700;
        }

        .auth-message {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            min-height: 24px;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-logo">
                🎓 کلاس‌یار
            </div>

            <h1>
                خوش برگشتی!
            </h1>

            <p class="auth-description">
                وارد حساب کاربری خودت شو.
            </p>

            <form class="auth-form" id="loginForm">

                <label for="email">
                    ایمیل
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

                <label for="password">
                    رمز عبور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="رمز عبور خودت را وارد کن"
                    autocomplete="current-password"
                    required
                >

                <button
                    class="auth-submit"
                    id="loginButton"
                    type="submit"
                >
                    ورود به حساب
                </button>

                <p
                    class="auth-message"
                    id="loginMessage"
                    aria-live="polite"
                ></p>

            </form>

            <div class="auth-footer">
                حساب کاربری نداری؟
                <a href="register.html">
                    ثبت‌نام کن
                </a>
            </div>

            <div class="auth-footer">
                <a href="index.html">
                    بازگشت به صفحه اصلی
                </a>
            </div>

        </section>

    </main>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginMessage =
            document.getElementById("loginMessage");

        const loginButton =
            document.getElementById("loginButton");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const password =
                    document.getElementById("password")
                        .value;


                // بررسی فیلدها
                if (!email || !password) {

                    loginMessage.style.color =
                        "#dc2626";

                    loginMessage.textContent =
                        "لطفاً ایمیل و رمز عبور را وارد کن.";

                    return;
                }


                // تغییر وضعیت دکمه
                loginButton.disabled = true;

                loginButton.textContent =
                    "در حال ورود...";


                loginMessage.style.color =
                    "#6c4ce3";

                loginMessage.textContent =
                    "در حال بررسی اطلاعات...";


                try {

                    const response =
                        await fetch(
                            "https://kelasyar-backend-2026.onrender.com/api/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    // ورود موفق
                    if (data.success) {

                        // ذخیره Token
                        localStorage.setItem(
                            "kelasyarToken",
                            data.token
                        );


                        // ذخیره اطلاعات کاربر
                        localStorage.setItem(
                            "kelasyarUser",
                            JSON.stringify(data.user)
                        );


                        loginMessage.style.color =
                            "#16a36a";

                        loginMessage.textContent =
                            `خوش آمدی ${data.user.fullName} 👋`;


                        loginButton.textContent =
                            "ورود موفق ✓";


                        // انتقال به پنل معلم
                        setTimeout(function () {

                            window.location.href =
                                "dashboard.html";

                        }, 1200);


                        return;
                    }


                    // خطای ورود
                    loginMessage.style.color =
                        "#dc2626";

                    loginMessage.textContent =
                        data.message ||
                        "ایمیل یا رمز عبور اشتباه است.";


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "ورود به حساب";


                } catch (error) {

                    console.error(
                        "Login Error:",
                        error
                    );


                    loginMessage.style.color =
                        "#dc2626";

                    loginMessage.textContent =
                        "ارتباط با سرور برقرار نشد. " +
                        "مطمئن شو Backend اجراست.";


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "ورود به حساب";
                }

            }
        );

    </script>

</body>

</html>
