<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود | کلاس‌یار</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: #fff;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .message.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .register-link {
      text-align: center;
      margin-top: 22px;
      color: #94a3b8;
      font-size: 14px;
    }

    .register-link a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: bold;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .server-status {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">ک</div>

    <h1>ورود به کلاس‌یار</h1>

    <p class="subtitle">
      مدیریت کلاس، دانش‌آموزان و نمرات
    </p>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">ایمیل</label>
        <input
          type="email"
          id="email"
          placeholder="example@gmail.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">رمز عبور</label>
        <input
          type="password"
          id="password"
          placeholder="رمز عبور خود را وارد کنید"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" id="loginButton">
        ورود
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register-link">
      حساب کاربری ندارید؟
      <a href="register.html">ثبت‌نام کنید</a>
    </div>

    <div class="server-status" id="serverStatus">
      در حال بررسی سرور...
    </div>

  </div>

  <script>
    const API_URL = "https://kelasyar-backend-2026.onrender.com";

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const serverStatus = document.getElementById("serverStatus");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    async function checkServer() {
      try {
        const response = await fetch(
          API_URL + "/api/status",
          {
            method: "GET",
            cache: "no-store"
          }
        );

        const text = await response.text();

        if (response.ok) {
          serverStatus.textContent = "● سرور آنلاین است";
          serverStatus.style.color = "#4ade80";
        } else {
          serverStatus.textContent =
            "● سرور پاسخ داد ولی خطا دارد: " + response.status;

          serverStatus.style.color = "#f87171";
        }

      } catch (error) {
        serverStatus.textContent = "● دسترسی به سرور برقرار نشد";
        serverStatus.style.color = "#f87171";
      }
    }

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage(
          "لطفاً ایمیل و رمز عبور را وارد کنید.",
          "error"
        );
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "در حال ورود...";

      message.className = "message";
      message.textContent = "";

      try {

        const response = await fetch(
          API_URL + "/api/login",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            }),

            cache: "no-store"
          }
        );

        const rawText = await response.text();

        let data = null;

        try {
          data = JSON.parse(rawText);
        } catch (jsonError) {
          data = null;
        }

        if (!response.ok) {

          let errorText = "";

          if (data && data.message) {
            errorText = data.message;
          } else if (rawText) {
            errorText = rawText.substring(0, 500);
          } else {
            errorText = "سرور پاسخ مناسبی ارسال نکرد.";
          }

          showMessage(
            "خطای سرور\n\n" +
            "کد خطا: " + response.status +
            "\n\n" +
            errorText,
            "error"
          );

          return;
        }

        if (!data) {
          showMessage(
            "سرور پاسخ JSON معتبر ارسال نکرد.\n\n" +
            "کد پاسخ: " + response.status,
            "error"
          );

          return;
        }

        if (!data.success) {
          showMessage(
            data.message || "ورود ناموفق بود.",
            "error"
          );

          return;
        }

        if (!data.token) {
          showMessage(
            "ورود انجام شد اما توکن دریافت نشد.",
            "error"
          );

          return;
        }

        localStorage.setItem(
          "kelasyarToken",
          data.token
        );

        if (data.user) {
          localStorage.setItem(
            "kelasyarUser",
            JSON.stringify(data.user)
          );
        }

        showMessage(
          "ورود با موفقیت انجام شد.\nدر حال انتقال...",
          "success"
        );

        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 700);

      } catch (error) {

        console.error("LOGIN ERROR:", error);

        showMessage(
          "خطا در ارتباط با Backend\n\n" +
          "آدرس سرور:\n" +
          API_URL +
          "\n\n" +
          "جزئیات:\n" +
          error.message,
          "error"
        );

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "ورود";

      }

    });

    checkServer();
  </script>

</body>
</html>
